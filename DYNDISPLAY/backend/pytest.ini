[pytest]
markers =
    v1: auth / login tests
    v2: user CRUD tests
    v3: site & post tests
    v4: media tests
    v5: layout tests
    v6: configuration tests
    v7: sync tests
    v8: supervision & settings tests
    v9: multi-media zone (playlist) tests
    v10: screen groups tests
    v11: user email & forgot-password tests
    v12: permission / role enforcement tests
    v13: client serialization activation tests
    v14: per-client data scope tests
    v15: per-client media scope tests
    e2e: end-to-end tests
