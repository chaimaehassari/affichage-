[pytest]
markers =
    v1: auth / login tests
    v2: user CRUD tests
    v3: site & post tests
    v4: media tests
    v5: layout tests
    v6: configuration tests
    v7: sync tests
    v8: supervision & settings tests
    v9: multi-media zone (playlist) tests
    v10: screen groups tests
    v11: user email & forgot-password tests
    v12: permission / role enforcement tests
    v13: client serialization activation tests
    v14: per-client data scope tests
    v15: per-client media scope tests
    v16: per-account device activation tests
    v17: multi-tenant security tests
    v18: sync robustness tests (savepoints, jobs orphelins)
    v19: sync bounded concurrency (executor, pool gesto-sync, orphan exclusion)
    v20: media token security tests (TTL, scoping, no session token in URL)
    v21: diffusion report tests (heartbeat current_media + rapport de diffusion multi-client)
    v22: reboot schedule tests (validation, next_reboot_at, batch hors périmètre)
    v23: reboot ponctuel tests (reboot_once_at: validation futur, purge, garde player lastRebootAt)
    v24: rapport de diffusion multi-clients (périmètre admin de groupe, verdict à jour / pas encore changé)
    v25: heure de redémarrage dans le formulaire box (CRUD post reboot_enabled/reboot_time)
    v26: périmètre administrateur (réglages globaux, licences clients, appareils, groupes vides)
    v28: un Admin Client voit toujours ses propres médias (owner_user_id), même sans client
    v29: non-regression isolation multi-clients (audit, media-token, zones/configuration, sync de groupe, layouts globaux)
    v30: stockage média adressé par contenu intra-client (Option B: liens, ref_count, migration)
    v30: media dedup intra-client Option B (liens partages, ref_count, migration)
    v31: Partie 2 — règle de création de rôles par un admin client (égaux/inférieurs, jamais plateforme, audit)
    e2e: end-to-end tests
